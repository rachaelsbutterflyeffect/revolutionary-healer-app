<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset and Restore · Mock-up</title>
<style>
  html,body{margin:0;height:100%;background:#0a0806;color:#fdfbf5;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
  p{opacity:.7;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
</style>
<script>
  try {
    sessionStorage.setItem('rr_mock', '1');
    if (!localStorage.getItem('rh_member_email')) {
      localStorage.setItem('rh_member_email', 'rr.mock@preview.local');
      localStorage.setItem('rh_member_login_at', String(Date.now()));
    }
    var e = localStorage.getItem('rh_member_email');
    localStorage.setItem('rh_ui_refresh', '1:' + e);
    sessionStorage.setItem('rh_ui_refresh', '1:' + e);
  } catch (x) {}
  location.replace('/app-refresh.html?rr_mock=1');
</script>
</head>
<body><p>Opening Reset and Restore mock-up…</p></body>
</html>
