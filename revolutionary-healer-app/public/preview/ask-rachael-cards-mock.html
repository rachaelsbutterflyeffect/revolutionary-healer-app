<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ask Rachael cards mock · Revolutionary Healer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Cormorant+Garamond:wght@500;600&family=Cormorant+SC:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Mock only. Card fills are the live Ask Rachael tiles, copied unchanged:
     odd = teal glass, even = the warm glass. Line art sits on top of that fill. */
  :root { --gold:#e8c873; --gold2:#fff1c4; --goldd:#b8913f; --ink:#06080b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ink); color: #fdfbf5; }
  body { font-family: Inter, system-ui, -apple-system, sans-serif; min-height: 100dvh; }
  .sky { position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(48% 36% at 18% 8%, rgba(63,214,200,.16), transparent 70%),
      radial-gradient(42% 32% at 88% 18%, rgba(255,214,130,.14), transparent 72%),
      #06080b; }
  .shell { position: relative; z-index: 1; width: min(480px, 100%); margin: 0 auto;
    padding: max(12px, env(safe-area-inset-top)) 20px calc(118px + env(safe-area-inset-bottom, 0px)); }
  .top { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
  .mark { margin: 0; font-family: "Cormorant SC", Georgia, serif; font-weight: 600; font-size: 15px; letter-spacing: .14em;
    background: linear-gradient(100deg, var(--goldd), var(--gold) 40%, #fffbe8 50%, var(--gold) 60%, var(--goldd));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(232,200,115,.35); background: rgba(255,255,255,.06); color: var(--gold); display: grid; place-items: center; }
  .welcome { text-align: center; margin: 18px 0 0; }
  .welcome h1 { margin: 0; font-family: Cinzel, serif; font-weight: 600; font-size: 26px; letter-spacing: .12em;
    background: linear-gradient(100deg, var(--goldd), var(--gold) 40%, #fffbe8 50%, var(--gold));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .welcome p { margin: 8px 0 0; font-family: "Cormorant Garamond", Georgia, serif; font-size: 22px; }
  .welcome b { color: var(--gold2); font-weight: 600; }
  .sec { margin-top: 28px; }
  .sec h2 { margin: 0 0 14px; display: flex; align-items: center; gap: 10px; font-family: Cinzel, serif; font-size: 12px; letter-spacing: .28em; font-weight: 600; color: var(--gold); }
  .sec h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(232,200,115,.7), transparent); }
  .door { width: 100%; display: flex; align-items: center; gap: 16px; padding: 16px 18px; border-radius: 24px; text-align: left; color: #fdfbf5;
    background: linear-gradient(135deg, rgba(255,255,255,.13), rgba(255,255,255,.045)); border: 1px solid rgba(255,236,190,.28);
    box-shadow: 0 10px 28px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.25); }
  .orb { flex: none; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; color: #1a1305; font-size: 18px;
    background: radial-gradient(circle at 35% 30%, #fffbe8, var(--gold) 46%, var(--goldd)); }
  .door b { display: block; font-family: "Cormorant Garamond", Georgia, serif; font-size: 22px; font-weight: 600; }
  .door small { display: block; margin-top: 2px; font-family: "Cormorant Garamond", Georgia, serif; font-size: 16px; font-weight: 500; color: #fdfbf5; }

  /* Live tile fills. Do not recolor. */
  .lanes { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -20px; padding: 4px 20px 10px; scrollbar-width: none; }
  .lanes::-webkit-scrollbar { display: none; }
  .rf-tile { all: unset; box-sizing: border-box; flex: none; width: 150px; height: 170px; scroll-snap-align: start; border-radius: 22px; padding: 16px;
    display: flex; flex-direction: column; justify-content: flex-end; cursor: pointer; position: relative; overflow: hidden;
    background: linear-gradient(160deg, rgba(63,214,200,.22), rgba(255,255,255,.04) 60%);
    border: 1px solid rgba(160,255,245,.3);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.2); }
  .rf-tile:nth-child(even) {
    background: linear-gradient(160deg, rgba(255,214,130,.26), rgba(255,255,255,.04) 60%);
    border-color: rgba(255,230,170,.35); }
  .art { position: absolute; left: 0; right: 0; top: 0; width: 100%; height: 112px; pointer-events: none;
    -webkit-mask-image: linear-gradient(180deg, #000 42%, transparent 88%);
    mask-image: linear-gradient(180deg, #000 42%, transparent 88%); }
  .copy { position: relative; z-index: 1; }
  .rf-tile b { font-family: Cinzel, serif; font-size: 12px; letter-spacing: .12em; line-height: 1.4; text-transform: uppercase; font-weight: 600; }
  .rf-tile small { display: block; margin-top: 4px; font-family: Inter, system-ui, sans-serif; font-size: 12px; letter-spacing: 0; text-transform: none; font-weight: 400; line-height: 1.35; color: #ffffffc0; }
  .deeps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .deep { min-height: 84px; border-radius: 18px; padding: 12px 8px; text-align: center; background: rgba(255,255,255,.06); border: 1px solid rgba(232,200,115,.35);
    font-family: Cinzel, serif; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
  .deep span { display: block; margin-bottom: 6px; font-size: 20px; color: var(--gold); letter-spacing: 0; }
  .nav { position: fixed; z-index: 5; left: 50%; bottom: max(10px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    width: min(452px, calc(100% - 20px)); display: flex; justify-content: space-around; padding: 8px 4px; border-radius: 26px;
    background: linear-gradient(180deg, rgba(63,214,200,.92), rgba(30,170,160,.92));
    box-shadow: 0 0 40px rgba(63,214,200,.5), inset 0 1px 0 rgba(255,255,255,.6); }
  .nav button { all: unset; min-height: 44px; min-width: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    font-size: 10px; font-weight: 500; color: #062522; }
  .nav button.on { background: rgba(255,255,255,.45); border-radius: 14px; padding: 4px 8px; }
  button { font: inherit; color: inherit; }
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<div class="shell">
  <header class="top">
    <p class="mark">REVOLUTIONARY HEALER</p>
    <div class="avatar" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.8 20c.9-3.6 3.8-5.6 7.2-5.6s6.3 2 7.2 5.6"/></svg>
    </div>
  </header>
  <div class="welcome">
    <h1>WELCOME BACK</h1>
    <p><b>Pick your focus.</b></p>
  </div>

  <section class="sec" aria-label="Your Activation Today">
    <h2>Your Activation Today</h2>
    <button type="button" class="door"><span class="orb" aria-hidden="true">◉</span><span><b>Find the activation that best fits you today</b></span></button>
  </section>

  <section class="sec" id="ask" aria-labelledby="ask-label">
    <h2 id="ask-label">Ask Rachael Anything</h2>
    <div class="lanes" id="lanes">
      <button type="button" class="rf-tile">
        <svg class="art" viewBox="0 0 150 170" aria-hidden="true">
          <g fill="none" stroke="#e8c873" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M32 58c16-18 70-18 86 0-16 18-70 18-86 0z"/>
            <circle cx="75" cy="58" r="11"/>
            <circle cx="75" cy="58" r="3.2" stroke="#fff1c4"/>
            <path d="M75 40v-8M52 46l-5-6M98 46l5-6" stroke="#fff1c4" stroke-width="1"/>
          </g>
        </svg>
        <span class="copy"><b>Spiritual Gifts</b><br><small>Your gifts are ready for more.</small></span>
      </button>
      <button type="button" class="rf-tile">
        <svg class="art" viewBox="0 0 150 170" aria-hidden="true">
          <g fill="none" stroke="#e8c873" stroke-width="1.15" stroke-linecap="round">
            <circle cx="75" cy="58" r="7" stroke="#fff1c4"/>
            <path d="M75 28v16M75 72v16M45 58h16M89 58h16"/>
            <path d="M54 37l11 11M96 37l-11 11M54 79l11-11M96 79l-11-11"/>
            <circle cx="75" cy="58" r="18"/>
          </g>
        </svg>
        <span class="copy"><b>Money &amp; Prosperity</b><br><small>Ready for a money breakthrough?</small></span>
      </button>
      <button type="button" class="rf-tile">
        <svg class="art" viewBox="0 0 150 170" aria-hidden="true">
          <g fill="none" stroke="#e8c873" stroke-width="1.2" stroke-linecap="round">
            <path d="M22 46c18-14 28 16 46 2s28-16 40-2 22 12 28 4"/>
            <path d="M18 64c20-16 30 18 50 2s30-18 44 0 20 14 26 2" stroke="#fff1c4"/>
            <path d="M24 82c18-12 28 14 46 2s28-14 38 0 18 10 24 2"/>
          </g>
        </svg>
        <span class="copy"><b>Energy &amp; Frequency</b><br><small>Change your energy. Change your day.</small></span>
      </button>
      <button type="button" class="rf-tile">
        <svg class="art" viewBox="0 0 150 170" aria-hidden="true">
          <g fill="none" stroke="#e8c873" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round">
            <path d="M36 88c10-28 68-28 78 0" stroke="#fff1c4"/>
            <path d="M75 86V34M58 80 46 48M92 80l12-32"/>
            <path d="M48 96h54"/>
          </g>
        </svg>
        <span class="copy"><b>Visibility &amp; Impact</b><br><small>Stop hiding your brilliance.</small></span>
      </button>
    </div>
  </section>

  <section class="sec" aria-labelledby="deep-label">
    <h2 id="deep-label">Go Deeper</h2>
    <div class="deeps">
      <button type="button" class="deep"><span aria-hidden="true">♫</span>Activation Library</button>
      <button type="button" class="deep"><span aria-hidden="true">✦</span>Your Shifts</button>
      <button type="button" class="deep"><span aria-hidden="true">❖</span>My Revolution</button>
    </div>
  </section>
</div>
<nav class="nav" aria-label="Main">
  <button type="button" class="on"><span>⌂</span>Home</button>
  <button type="button"><span>✧</span>Today's Focus</button>
  <button type="button"><span>❋</span>Chat</button>
  <button type="button"><span>♫</span>Activations</button>
  <button type="button"><span>❖</span>Revolution</button>
</nav>
</body>
</html>
