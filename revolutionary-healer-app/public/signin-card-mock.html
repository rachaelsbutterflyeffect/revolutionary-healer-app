<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign-in card mock · The Revolutionary Healer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* Visual mock only. Does not submit credentials and does not replace /. */
  :root {
    --gold: #e8c873;
    --gold-2: #fff1c4;
    --ink: #f7f3ea;
    --charcoal: #070605;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--charcoal);
    color: var(--ink);
    font-family: Inter, system-ui, sans-serif;
    font-style: normal;
  }
  .stage {
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 22px;
  }
  .card {
    width: min(400px, 100%);
    padding: 28px 26px 26px;
    border-radius: 26px;
    background: rgba(255, 255, 255, 0.045);
    border: 1px solid rgba(232, 200, 115, 0.55);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(10px);
  }
  .mark {
    position: relative;
    height: 148px;
    margin: 0 8px 6px;
  }
  .mark canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .rule {
    width: 72px;
    height: 1px;
    margin: 0 auto 22px;
    background: rgba(232, 200, 115, 0.85);
  }
  h1 {
    margin: 0 0 26px;
    text-align: center;
    font-family: Cinzel, Georgia, serif;
    font-style: normal;
    font-weight: 500;
    font-size: clamp(26px, 6.4vw, 32px);
    line-height: 1.15;
    letter-spacing: 0.04em;
    color: var(--gold-2);
  }
  form { display: flex; flex-direction: column; gap: 12px; }
  .field { position: relative; }
  input {
    display: block;
    width: 100%;
    height: 52px;
    margin: 0;
    padding: 0 18px;
    border-radius: 999px;
    border: 1px solid rgba(232, 200, 115, 0.38);
    background: rgba(7, 6, 5, 0.55);
    color: var(--ink);
    font: 16px/1.2 Inter, system-ui, sans-serif;
    outline: none;
  }
  input[type="password"], input.pw { padding-right: 48px; }
  input::placeholder { color: rgba(247, 243, 234, 0.42); }
  input:focus { border-color: rgba(255, 241, 196, 0.8); }
  .eye {
    position: absolute;
    top: 0;
    right: 0;
    width: 48px;
    height: 52px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--gold);
    cursor: pointer;
  }
  .eye:focus-visible { outline: 2px solid var(--gold-2); outline-offset: -4px; border-radius: 999px; }
  button.enter {
    height: 52px;
    margin-top: 4px;
    border: 0;
    border-radius: 999px;
    background: linear-gradient(180deg, #fff1c4, #e8c873 55%, #c4a15a);
    color: #1a1305;
    font-family: Cinzel, Georgia, serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 0 18px rgba(232, 200, 115, 0.28);
  }
  button.enter:focus-visible { outline: 2px solid #fffbe8; outline-offset: 3px; }
  .forgot {
    display: block;
    margin-top: 4px;
    text-align: center;
    color: var(--gold-2);
    font-size: 13.5px;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .forgot:hover { color: #fff; }
</style>
</head>
<body>
  <main class="stage">
    <section class="card" aria-labelledby="signin-heading">
      <div class="mark" aria-hidden="true"><canvas id="fly"></canvas></div>
      <div class="rule" aria-hidden="true"></div>
      <h1 id="signin-heading">Revolutionary Healer</h1>
      <form id="mock-form" action="#" method="post" novalidate>
        <label class="field">
          <span class="visually-hidden" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Email</span>
          <input id="email" name="email" type="email" autocomplete="username" placeholder="you@email.com" inputmode="email" autocapitalize="off" spellcheck="false">
        </label>
        <label class="field">
          <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Password</span>
          <input id="password" class="pw" name="password" type="password" autocomplete="current-password" placeholder="Password" autocapitalize="off" spellcheck="false">
          <button type="button" class="eye" id="eye" aria-label="Show password" aria-pressed="false" aria-controls="password">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.75"/>
            </svg>
          </button>
        </label>
        <button class="enter" type="submit">Sign in</button>
        <a class="forgot" href="/contact-support">Forgot your password?</a>
      </form>
    </section>
  </main>
<script>
(function () {
  var form = document.getElementById("mock-form");
  form.addEventListener("submit", function (event) { event.preventDefault(); });
  var input = document.getElementById("password");
  var eye = document.getElementById("eye");
  var open = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.75"/></svg>';
  var shut = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="m2 2 20 20" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  eye.addEventListener("mousedown", function (event) { event.preventDefault(); });
  eye.addEventListener("click", function () {
    var show = input.type === "password";
    input.type = show ? "text" : "password";
    eye.setAttribute("aria-pressed", show ? "true" : "false");
    eye.setAttribute("aria-label", show ? "Hide password" : "Show password");
    eye.innerHTML = show ? shut : open;
  });

  /* Same gold butterfly curve used on the in-app home, drawn small inside the card. */
  var fly = document.getElementById("fly");
  var fx = fly.getContext("2d");
  var wings = [], swirl = [], FW = 0, FH = 0, T = 0, frame = 0;
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function resize() {
    var d = Math.min(window.devicePixelRatio || 1, 2);
    var w = fly.clientWidth, h = fly.clientHeight;
    if (!w || !h || (w === FW && h === FH && wings.length)) return;
    FW = w; FH = h;
    fly.width = FW * d; fly.height = FH * d;
    fx.setTransform(d, 0, 0, d, 0, 0);
    wings = Array.from({ length: 420 }, function () {
      var t = Math.random() * Math.PI * 2, side = Math.random() < 0.5 ? -1 : 1;
      var r = (Math.exp(Math.sin(t)) - 2 * Math.cos(4 * t) + Math.pow(Math.sin((2 * t - Math.PI) / 24), 5)) * Math.pow(Math.random(), 0.35);
      return { bx: Math.sin(t) * r * side, by: -Math.cos(t) * r, s: side, j: Math.random() * 6, teal: Math.random() < 0.12 };
    });
    var k = Math.min(FW, FH) / 6.4;
    swirl = Array.from({ length: 70 }, function () {
      return { a: Math.random() * 7, r: k * (0.55 + Math.random() * 1.15), w: 0.004 + Math.random() * 0.008, s: Math.random() * 1.3 + 0.35, j: Math.random() * 6, teal: Math.random() < 0.1 };
    });
  }
  function draw(force) {
    T += 0.016; frame += 1;
    if (!force && frame % 2 === 1) return;
    if (!FW) return;
    fx.clearRect(0, 0, FW, FH);
    var cx = FW / 2, cy = FH / 2 + 4, k = Math.min(FW, FH) / 6.4;
    fx.globalCompositeOperation = "lighter";
    wings.forEach(function (p) {
      var x = cx + Math.abs(p.bx) * p.s * k * 0.92 + Math.sin(T * 0.6 + p.j) * 0.6;
      var y = cy + p.by * k * 0.9 + Math.cos(T * 0.5 + p.j) * 0.6;
      fx.fillStyle = p.teal ? "rgba(110,240,228,0.45)" : "rgba(255,224,150,0.9)";
      fx.fillRect(x, y, 1.5, 1.5);
    });
    fx.fillStyle = "rgba(255,246,214,0.95)";
    fx.fillRect(cx - 1, cy - k * 0.85, 2, k * 1.45);
    if (!reduce) {
      swirl.forEach(function (v) {
        v.a += v.w * 2;
        var tw = 0.3 + 0.55 * Math.abs(Math.sin(T * 2 + v.j));
        var vx = cx + Math.cos(v.a) * v.r, vy = cy + Math.sin(v.a) * v.r * 0.62;
        fx.fillStyle = v.teal ? "rgba(110,240,228," + tw * 0.55 + ")" : "rgba(255,226,150," + tw + ")";
        fx.beginPath(); fx.arc(vx, vy, v.s, 0, Math.PI * 2); fx.fill();
      });
    }
    fx.globalCompositeOperation = "source-over";
  }
  function loop() { draw(false); if (!reduce) requestAnimationFrame(loop); }
  resize();
  if (reduce) draw(true); else loop();
  if (window.ResizeObserver) new ResizeObserver(resize).observe(fly);
})();
</script>
</body>
</html>
